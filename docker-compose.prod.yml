# Production stack for Launchpad (or plain `docker compose -f docker-compose.prod.yml up -d --build`).
# Launchpad removes published ports and adds the Traefik labels and `web` network.
# The stack runs its own cloudflared connector, so the app does not depend on a
# tunnel on the panel host. Point the tunnel's public hostname at this stack:
#   crate.<domain> -> http://app:3000        (dedicated tunnel)
# or keep Launchpad's wildcard -> http://traefik:80 (the connector can reach both
# `app` and `traefik`; a shared token is safe but adds a redundant connector).
# Required project environment variables:
#   BETTER_AUTH_URL  exact public origin, e.g. https://crate.example.com
#   BETTER_AUTH_SECRET
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   POSTGRES_PASSWORD
#   TUNNEL_TOKEN     Cloudflare Tunnel token (Zero Trust -> Networks -> Tunnels)
# Optional: SPOTIFY_MARKET (defaults to US), LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.

name: crate

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-US}
      # Pass credentials through the standard PG* variables instead of a
      # DATABASE_URL: the generated password never has to survive URL parsing.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: crate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: crate
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:

networks:
  web:
    external: true
