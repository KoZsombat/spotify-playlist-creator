# Production stack for Launchpad (or plain `docker compose -f docker-compose.prod.yml up -d --build`).
# Launchpad removes published ports and publishes the `app` service through Traefik.
# Required project environment variables:
#   BETTER_AUTH_URL  public URL, e.g. https://crate.example.com
#   BETTER_AUTH_SECRET
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   POSTGRES_PASSWORD
# Optional: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.

name: crate

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      DATABASE_URL: postgres://crate:${POSTGRES_PASSWORD}@db:5432/crate
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
